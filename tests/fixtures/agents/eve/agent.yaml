# Example agent for the core's tests, modelled on a project-manager style agent.
agent:
  name: eve
  display_name: Eve (AI)
  role: Technical Document Reviewer
  owner: A. Owner
  owner_email: owner@acme.example
  upn: eve@acme.example
  enabled: true
models:
  region: ap-southeast-2
  prompt_caching: true
  triage: true
  tiers:
    fast:
      model_id: au.anthropic.claude-haiku-4-5-20251001-v1:0
      max_tokens: 1024
    default:
      model_id: au.anthropic.claude-sonnet-5
      max_tokens: 8192
    deep:
      model_id: au.anthropic.claude-opus-5-5
      max_tokens: 8192
  reviewers:
    openai-frontier:
      model_id: global.openai.gpt-6.1-sol
      max_tokens: 16000
      label: OpenAI GPT-6.1 Sol
      global_routing: true
    anthropic-frontier:
      model_id: global.anthropic.claude-fable-5-1
      max_tokens: 16000
      label: Anthropic Claude Fable 5.1
      global_routing: true
    xai-frontier:
      model_id: global.xai.grok-4.7
      max_tokens: 16000
      label: xAI Grok 4.7
      global_routing: true
    openai-frontier-alt:
      model_id: global.openai.gpt-6-astra
      max_tokens: 16000
      label: OpenAI GPT-6 Astra
      global_routing: true
  allow_global_reviewers: true
  escalation:
    max_tool_steps: 8
    urgency_terms:
    - urgent
    - important
    - pressing
    - asap
    - high priority
    class1_doc_types:
    - REQ
    - RDS
    - BOD
    class1_terms:
    - class 1
    - protection
    - earthing
    - hv
    - fire
    - structural
    - pressure system
    - safety in design
budget:
  daily_usd: 30
  monthly_usd: 400
  alert_at: 0.8
skills:
  always:
  - plain-voice
  on_demand:
  - house-style
mailbox:
  enabled: true
  poll_seconds: 60
github:
  enabled: true
  command: /eve
  skip_label: no-eve
  repos:
    example/openclaw:
      mode: auto
    example/pipeline-dashboard:
      mode: auto
  review_event: COMMENT
  limits:
    reviews_per_day: 25
    repo_reviews_per_day: 10
    daily_usd: 15
    max_inline: 15
jira_watch:
  enabled: true
mcp_servers:
  web:
    url: inprocess://web
  mail:
    url: http://mcp-mail-eve/mcp/
  jira:
    url: http://mcp-jira-eve/mcp/
  confluence:
    url: http://mcp-confluence-eve/mcp/
  attachments:
    url: inprocess://attachments
  files:
    url: inprocess://files
  openclaw:
    url_env: OPENCLAW_MCP_URL
  schedule:
    url: inprocess://schedule
  review:
    url: inprocess://review
  github:
    url: inprocess://github
tools:
  allow:
  - server: web
    name: web_search
  - server: web
    name: read_web_page
  - server: mail
    name: send_email
    writes: true
    scope_args:
    - to
    - cc
  - server: mail
    name: send_email_external
    writes: true
    confirm: true
  - server: jira
    name: search_issues
  - server: jira
    name: get_issue
  - server: jira
    name: count_issues
  - server: jira
    name: list_fields
  - server: jira
    name: jira_get
  - server: jira
    name: find_user
  - server: jira
    name: add_comment
    writes: true
  - server: confluence
    name: search_pages
  - server: confluence
    name: get_page
  - server: confluence
    name: list_spaces
  - server: confluence
    name: add_comment
    writes: true
  - server: attachments
    name: list_attachments
  - server: attachments
    name: read_attachment
  - server: attachments
    name: view_attachment
  - server: files
    name: create_file
  - server: files
    name: edit_file
  - server: files
    name: file_outline
  - server: files
    name: preview_file
  - server: files
    name: insert_image
  - server: files
    name: send_file
    writes: true
  - server: files
    name: email_file
    writes: true
    scope_args:
    - to
    - cc
  - server: openclaw
    name: search_docs
  - server: openclaw
    name: sharepoint_get
  - server: schedule
    name: schedule_task
    writes: true
    scope_args:
    - deliver_to
  - server: schedule
    name: list_scheduled_tasks
  - server: schedule
    name: cancel_scheduled_task
    writes: true
  - server: review
    name: choose_review_model
  - server: review
    name: clear_review_model
  - server: github
    name: get_file
  standing_rules: []
memory:
  enabled: true

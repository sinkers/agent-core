# A plain image registry for the PoC: images are pushed through a port-forward and every node pulls them as
# registry.poc:5000/... (mirrored to this NodePort by /etc/rancher/k3s/registries.yaml, see cluster.sh).
apiVersion: v1
kind: Namespace
metadata: {name: registry}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: registry, namespace: registry}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: registry}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports: [{containerPort: 5000}]
          env: [{name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}]
          volumeMounts: [{name: data, mountPath: /var/lib/registry}]
          resources: {requests: {memory: 64Mi, cpu: 50m}, limits: {memory: 256Mi}}
      volumes: [{name: data, persistentVolumeClaim: {claimName: registry}}]
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: registry}
spec:
  type: NodePort
  selector: {app: registry}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30500}]
